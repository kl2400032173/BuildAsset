spring.application.name=buildasset-api-gateway

server.port=8000

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:9000/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# Gateway Routes
spring.cloud.gateway.server.webmvc.routes[0].id=contractor-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CONTRACTOR-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/contractors/**

spring.cloud.gateway.server.webmvc.routes[1].id=equipment-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://EQUIPMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/equipment/**

spring.cloud.gateway.server.webmvc.routes[2].id=rental-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://RENTAL-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/rentals/**

spring.cloud.gateway.server.webmvc.routes[3].id=dispatch-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://DISPATCH-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/dispatch/**